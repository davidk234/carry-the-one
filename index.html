<style>
/* Layout: one-column app on engineering graph paper. The problem is the hero; the keypad owns the thumb zone; highlighter marks only what matters. */
:root{
  --bg:#E9F0E1; --grid-h:#D5E3C8; --grid-v:#D5E3C8; --major-h:#BCD2A9; --major-v:#BCD2A9;
  --grid-size:20px; --major-size:100px;
  --fg:#1C2920; --muted:#55675A; --surface:#F6FAF1; --surface-2:#DDE8D2; --line:#B3C7A5;
  --hl:#FFD12E; --hl-ink:#1C2920; --good:#22784A; --bad:#C2352A; --shade:rgba(28,41,32,.18);
  --ink:var(--fg);
  --font-num:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111813; --grid-h:#18221A; --grid-v:#18221A; --major-h:#223024; --major-v:#223024;
    --fg:#DCE7D6; --muted:#91A391; --surface:#172019; --surface-2:#1F2A21; --line:#2F3F31;
    --hl:#F5C518; --hl-ink:#141A12; --good:#62C784; --bad:#FF7266; --shade:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111813; --grid-h:#18221A; --grid-v:#18221A; --major-h:#223024; --major-v:#223024;
  --fg:#DCE7D6; --muted:#91A391; --surface:#172019; --surface-2:#1F2A21; --line:#2F3F31;
  --hl:#F5C518; --hl-ink:#141A12; --good:#62C784; --bad:#FF7266; --shade:rgba(0,0,0,.45);
  color-scheme:dark;
}
/* Pen colors bought in the shop: light/dark pairs, switched with the theme */
:root[data-inked]{ --ink:var(--ink-light); }
@media (prefers-color-scheme: dark){ :root[data-inked]:not([data-theme="light"]){ --ink:var(--ink-dark); } }
:root[data-inked][data-theme="dark"]{ --ink:var(--ink-dark); }

*{box-sizing:border-box}
html,body{height:100%}
html{overscroll-behavior:none}
body{background-color:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;-webkit-tap-highlight-color:transparent}
body,.screen{
  background-image:
    linear-gradient(var(--major-h) 1px,transparent 1px),
    linear-gradient(90deg,var(--major-v) 1px,transparent 1px),
    linear-gradient(var(--grid-h) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-v) 1px,transparent 1px);
  background-size:var(--major-size) var(--major-size),var(--major-size) var(--major-size),var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 18px}
.wordmark{font-family:var(--font-num);font-weight:900;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:1;display:flex;align-items:flex-start;gap:2px;margin:0}
.wordmark sup{font-size:13px;line-height:1;background:var(--hl);color:var(--hl-ink);border:2px solid var(--fg);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;margin-top:-6px;font-family:var(--font-body);font-weight:800}
.purse{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--fg);border-radius:999px;padding:5px 14px 5px 6px;font-weight:800;font-size:18px;box-shadow:0 2px 0 var(--fg)}
.purse svg{width:24px;height:24px;flex:none}
.purse small{font-weight:600;color:var(--muted);font-size:12px}
.coin{display:inline-block;vertical-align:-4px}

.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h2.title{font-family:var(--font-num);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.mark{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 88%,transparent 88%);color:inherit;padding-inline:.08em}
.muted{color:var(--muted)}

.home{display:grid;gap:22px}
@media (min-width:860px){.home{grid-template-columns:1.35fr 1fr;align-items:start;gap:28px}}
.stack{display:grid;gap:20px;min-width:0}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.mode{padding:12px 10px 13px}.mode b{font-size:26px}.mode span{font-size:12px}}
.mode{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 16px;display:grid;gap:4px}
.mode b{font-family:var(--font-num);font-size:30px;font-weight:900;text-transform:uppercase;line-height:1}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 3px 0 var(--fg)}
.mode[aria-pressed="true"] b{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 90%,transparent 90%);justify-self:start;padding-inline:3px;margin-inline:-3px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:grid;justify-items:center;gap:2px}
.chip b{font-family:var(--font-num);font-size:28px;font-weight:900;line-height:1}
.chip span{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] span{color:var(--bg);opacity:.75}

.go{width:100%;border:2px solid var(--fg);background:var(--hl);color:var(--hl-ink);border-radius:16px;min-height:66px;font-family:var(--font-num);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 5px 0 var(--fg);transition:transform .06s,box-shadow .06s;display:flex;align-items:center;justify-content:center;gap:12px}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--fg)}
.go small{font-family:var(--font-body);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;opacity:.75}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0;display:flex;gap:14px;flex-wrap:wrap}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.daily{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:76px;height:76px}
.daily h3,.rank h3{margin:0 0 2px;font-size:17px;font-weight:800}
.daily p,.rank p{margin:0;font-size:13.5px;color:var(--muted)}
.rank .bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.rank .bar i{display:block;height:100%;background:var(--fg)}
.rank-name{font-family:var(--font-num);font-size:34px;font-weight:900;text-transform:uppercase;line-height:1;margin:2px 0 4px}
.boosts{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
.tag.on{border-style:solid;border-color:var(--fg);background:var(--hl);color:var(--hl-ink)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1.5px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:10px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] span{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding-inline:4px}

/* game */
.screen{position:fixed;inset:0;z-index:20;background-color:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.screen-in{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;gap:10px}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;height:42px;padding:0 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.clock{justify-self:center;font-family:var(--font-num);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.run-carries{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:18px}
.run-carries svg{width:22px;height:22px}

async function flushCloud(){

async function initCloud(){
  try{

    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){cloud.status='device';return;}
    const uid=await user.id();
    if(!uid){cloud.status='device';return;}
    const ref=db.doc('data/users/'+uid+'/save');
    const snap=await ref.get();
    cloud.ref=ref; cloud.status='cloud';
    if(snap.exists){
      const remote=JSON.parse(JSON.stringify(snap.data()));
      if((remote.updatedAt||0)>(save.updatedAt||0)&&!g){save=migrate(remote);writeLocal();applyLook();render();}

function gen(op,level){
  const L=Math.max(1,Math.min(9,Math.round(level)));
  const mk=(parts,ans)=>{const p=P(parts,ans,op);p.level=L;return p;};
  if(op==='add'){const R=LV.add[L-1];let a=rnd(...R[0]),b=rnd(...R[1]);if(Math.random()<.5)[a,b]=[b,a];return mk([N(a),S('+'),N(b)],{n:a+b,d:1});}
  if(op==='sub'){const R=LV.sub[L-1];let a=rnd(...R[0]),b=rnd(...R[1]);if(a===b)a+=rnd(1,5);
    if(b>a&&!(Math.random()<LV.negSub[L-1]))[a,b]=[b,a];
    return mk([N(a),S('−'),N(b)],{n:a-b,d:1});}
  if(op==='mul'){const R=pick(LV.mul[L-1]);let a=rnd(...R[0]),b=rnd(...R[1]);if(Math.random()<.5)[a,b]=[b,a];return mk([N(a),S('×'),N(b)],{n:a*b,d:1});}
  if(op==='div'){const R=LV.div[L-1];const d=rnd(...R[0]),q=rnd(...R[1]);return mk([N(d*q),S('÷'),N(d)],{n:q,d:1});}
  for(let guard=0;guard<300;guard++){
    if(L<=2){
      if(Math.random()<(L===1?.5:.35)){const d=pick(L===1?[2,3,4,5,10]:[2,3,4,5,6,8,10]),n=L===1?1:rnd(1,d-1);if(gcd(n,d)>1)continue;
        const k=d*rnd(2,L===1?6:9);return mk([F(n,d),S('×'),N(k)],{n:n*k,d});}
      const d=rnd(3,L===1?10:12);let a=rnd(1,d-1),b=rnd(1,d-1);if(gcd(a,d)>1||gcd(b,d)>1)continue;
      if(L===1||Math.random()<.5){if(L===1&&a+b>d)continue;return mk([F(a,d),S('+'),F(b,d)],{n:a+b,d});}
      if(a===b)continue;if(a<b)[a,b]=[b,a];return mk([F(a,d),S('−'),F(b,d)],{n:a-b,d});
    }
    if(L===3){
      const pr=pick([[2,4],[3,6],[4,8],[5,10],[2,6],[3,9],[2,8],[4,12],[6,12],[2,10]]);
      const [d1,d2]=Math.random()<.5?pr:[pr[1],pr[0]];
      const n1=rnd(1,d1-1),n2=rnd(1,d2-1);if(gcd(n1,d1)>1||gcd(n2,d2)>1)continue;
      let A=F(n1,d1),B=F(n2,d2);
      if(Math.random()<.55)return mk([A,S('+'),B],{n:n1*d2+n2*d1,d:d1*d2});
      const v1=n1*d2,v2=n2*d1;if(v1===v2)continue;if(v1<v2)[A,B]=[B,A];
      return mk([A,S('−'),B],{n:Math.abs(v1-v2),d:d1*d2});
    }
    const C=LV.frac[L-1];
    const d1=pick(C.dens),d2=pick(C.dens);if(d1===d2)continue;
    const n1=rnd(1,C.imp&&Math.random()<.4?d1*2-1:d1-1),n2=rnd(1,d2-1);
    if(n1===d1||gcd(n1,d1)>1||gcd(n2,d2)>1)continue;
    const o=pick(C.ops);let A=F(n1,d1),B=F(n2,d2),ans;
    if(o==='+')ans={n:n1*d2+n2*d1,d:d1*d2};
    else if(o==='−'){const v1=n1*d2,v2=n2*d1;if(v1===v2)continue;if(v1<v2)[A,B]=[B,A];ans={n:Math.abs(v1-v2),d:d1*d2};}
    else if(o==='×')ans={n:n1*n2,d:d1*d2};
    else ans={n:n1*d2,d:d1*n2};
    if(reduce(ans).d>C.maxD)continue;
    return mk([A,S(o),B],ans);

const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxRunning=false;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim()||'#888';}
function burst(kind){
  if(reduceMotion)return;
  const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const cols=[tok('hl'),tok('fg'),tok('good'),tok('ink'),tok('bad')];
  const n=kind==='coins'?36:90;
  for(let i=0;i<n;i++){
    if(kind==='coins')parts.push({k:'coin',x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*.6,vy:2+Math.random()*2.5,r:9+Math.random()*5,life:260,rot:0,vr:0});
    else parts.push({k:'bit',x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.38,vx:(Math.random()-.5)*12,vy:-6-Math.random()*8,w:6+Math.random()*6,h:4+Math.random()*4,c:pick(cols),life:140,rot:Math.random()*6,vr:(Math.random()-.5)*.3});
  }
  if(!fxRunning){fxRunning=true;requestAnimationFrame(stepFx);}
}
function stepFx(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  const hl=tok('hl'),fg=tok('fg'),hi=tok('hl-ink');
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.life--;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.k==='bit'){p.vy+=.32;p.vx*=.99;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();}
    else{cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=hl;cx.fill();cx.lineWidth=2;cx.strokeStyle=fg;cx.stroke();
      cx.fillStyle=hi;cx.font='800 '+Math.round(p.r*1.2)+'px Figtree,system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('1',p.x,p.y+1);}
  }
  if(parts.length)requestAnimationFrame(stepFx);else{fxRunning=false;cx.clearRect(0,0,innerWidth,innerHeight);}
}

    const path=x.r.c?`M${x0},${base} V${top+r} Q${x0},${top} ${x0+r},${top} H${x0+bw-r} Q${x0+bw},${top} ${x0+bw},${top+r} V${base} Z`:'';
    const isToday=i===days.length-1,lbl=x.date.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    return `<g class="bar-g" data-bar="${lbl}: ${x.r.c} correct${x.r.m?' · goal met':''}"><rect x="${L+i*cw}" y="${T-14}" width="${cw}" height="${base-T+14}" fill="transparent"/>${path?`<path d="${path}" fill="${x.r.m?'var(--fg)':'var(--muted)'}" opacity="${x.r.m?1:.45}"/>`:`<rect x="${x0}" y="${base-2}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`}
      <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" font-weight="${isToday?800:600}" fill="${isToday?'var(--fg)':'var(--muted)'}">${x.date.toLocaleDateString(undefined,{weekday:'narrow'})}</text>
      ${isToday&&x.r.c?`<text x="${cx}" y="${top-5}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--fg)">${x.r.c}</text>`:''}<title>${lbl}: ${x.r.c} correct</title></g>`;}).join('');
  const gy=y(G);

}

/* ---------- game ---------- */
function pickOp(ops){
  if(ops.length===1)return ops[0];
  const w=ops.map(k=>{const o=save.ops[k];if(o.a<10)return 1;return 1+Math.min(2,(1-o.c/o.a)*4);});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<ops.length;i++){r-=w[i];if(r<=0)return ops[i];}
  return ops[ops.length-1];
}
let wake=null;
async function lockScreen(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}}

function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
let resultsAt=0;
let g=null,rafId=0;

     misses:[],times:[],input:'',locked:true,double:save.double,ended:false,freezesUsed:0,startLife:save.life.correct,p:null,prevText:'',queue:[],count:0,review:false,buf:[],buffering:false,missRun:0,lvNote:null,lv:{},lv0:{}};

  $('#layer').innerHTML=`<div class="screen" id="game"><div class="screen-in">
    <div class="hud">
      <button class="icon-btn" data-g="end" aria-label="End run">✕ End</button>
      <div class="clock" id="clock"></div>
      <span class="run-carries" id="runc">${coinSvg()}<span class="num">+0</span></span>
    </div>
    ${g.mode!=='endless'?'<div class="tbar"><i id="tbar"></i></div>':''}
    <div class="streak" id="streak"></div>
    <div class="stage" aria-live="polite">
      <div class="problem" id="prob"></div>
      <div class="answer" id="ans"></div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="pad" id="pad">
      ${['7','8','9','back','4','5','6','/','1','2','3','-','skip','0','enter'].map(k=>{
        const lbl={back:'⌫','/':'/','-':'±',skip:'Skip',enter:'Check'}[k]||k;
        const cls=k==='skip'?'key small':k==='enter'?'key enter':'key';
        const aria={back:'Delete','/':'Fraction bar','-':'Negative sign',skip:'Skip',enter:'Check answer'}[k]||k;
        return `<button class="${cls}" data-k="${k}" aria-label="${aria}">${lbl}</button>`;}).join('')}
    </div>
    <p class="kbd-hint">Type with your keyboard · Enter to check · Space to skip · Esc to end</p>
  </div></div>`;
  document.getElementById('nav').hidden=true;
  bindPad();lockScreen();hud();

    $('#clock').textContent=g.mode==='sprint'?Math.floor(g.dur/60)+':'+pad2(g.dur%60):fmtClock(0);

      if(g!==run||run.ended)return;
      if(n>0){$('#prob').innerHTML=`<span class="count">${n}</span>`;$('#ans').innerHTML='';$('#fb').textContent=n===3?'Get ready':'';sfx('count');n--;setTimeout(step,reduceMotion?350:560);}

let lastPtr=0;
function ripple(b,x,y){
  if(reduceMotion||!b)return;
  const r=b.getBoundingClientRect(),dd=Math.max(r.width,r.height)*2.2;
  const cx=(x==null?r.left+r.width/2:x)-r.left,cy=(y==null?r.top+r.height/2:y)-r.top;
  const sp=document.createElement('span');sp.className='ripple';
  sp.style.width=sp.style.height=dd+'px';sp.style.left=(cx-dd/2)+'px';sp.style.top=(cy-dd/2)+'px';
  b.appendChild(sp);const kill=()=>sp.remove();sp.addEventListener('animationend',kill);setTimeout(kill,800);
}
function bindPad(){
  const pad=$('#pad');if(!pad)return;
  const up=()=>pad.querySelectorAll('.key.down').forEach(b=>b.classList.remove('down'));
  pad.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.key');if(!b)return;
    e.preventDefault();lastPtr=performance.now();
    b.classList.add('down');ripple(b,e.clientX,e.clientY);if(e.pointerType==='touch')buzz(6);if(g&&!g.ended&&!(g.locked&&!g.buffering))sfx('key',b.dataset.k);press(b.dataset.k);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,up));
  pad.addEventListener('contextmenu',e=>e.preventDefault());
}
function raceAnswered(){
  g.answered++;
  const b=$('#tbar');if(b)b.style.transform='scaleX('+(g.answered/g.target)+')';
  if(g.answered>=g.target){g.stopT=performance.now();$('#clock').textContent=fmtClock(g.stopT-g.startT+g.penalty);return true;}
  return false;
}
function adjustLevel(op,delta){
  const old=g.lv[op];if(old===undefined)return;
  const nv=clampLv(old+delta,g.diff);g.lv[op]=nv;
  const oi=Math.round(old),ni=Math.round(nv);

}
function tick(){
  if(!g||g.ended)return;
  if(g.mode==='race'){
    if(!g.stopT)$('#clock').textContent=fmtClock(performance.now()-g.startT+g.penalty);
    rafId=requestAnimationFrame(tick);return;
  }
  const rem=g.endAt-performance.now();
  if(rem<=0){finish(false);return;}
  const sec=Math.ceil(rem/1000),c=$('#clock');
  c.textContent=Math.floor(sec/60)+':'+pad2(sec%60);c.classList.toggle('low',sec<=10);
  if(sec<=5&&sec!==g.lastSec){g.lastSec=sec;sfx('tick');}
  const b=$('#tbar');if(b)b.style.transform='scaleX('+(rem/(g.dur*1000))+')';
  rafId=requestAnimationFrame(tick);
}
function hud(){
  const mult=g.streak>=25?3:g.streak>=10?2:1;
  const earned=(g.base+g.speed+g.mult)*(g.double?2:1);
  $('#runc').innerHTML=coinSvg()+'<span class="num">+'+earned+'</span>';
  $('#streak').innerHTML=`<span class="pill ${mult>1?'hot':''}">Streak ${g.streak}${mult>1?' · ×'+mult:''}</span>${g.mode==='endless'?`<span class="pill">Solved ${g.solved}</span>`:''}${g.mode==='race'?`<span class="pill">${Math.min(g.answered+(g.ended||g.locked?0:1),g.target)} / ${g.target}</span>${g.penalty?`<span class="pill" style="color:var(--bad)">+${g.penalty/1000}s</span>`:''}`:''}${g.double?'<span class="pill hot">×2 boost</span>':''}${save.freezes?`<span class="pill">Freezes ${save.freezes}</span>`:''}${levelPill()}`;
}
function levelPill(){
  if(!g.p)return '';
  const op=g.p.op,L=g.p.level||Math.round(g.lv[op]);
  const note=g.lvNote&&g.lvNote.op===op&&g.count<=g.lvNote.until?g.lvNote.dir:0;
  return `<span class="pill lvl${note>0?' up':note<0?' down':''}">${g.ops.length>1?OPS[op].sym+' ':''}Level ${L}${note>0?' ▲':note<0?' ▼':''}</span>`;
}
function next(){
  g.count++;
  let p,guard=0;
  const qi=g.queue.findIndex(q=>q.due<=g.count);
  if(qi>=0){p=g.queue.splice(qi,1)[0].p;g.review=true;}
  else{g.review=false;const op=pickOp(g.ops);do{p=gen(op,g.lv[op]);}while(p.text===g.prevText&&guard++<10);}
  g.p=p;g.prevText=p.text;g.input='';g.locked=false;g.t0=performance.now();
  $('#prob').innerHTML=p.parts.map(x=>x.t==='s'?`<span class="op">${x.v}</span>`:x.t==='f'?`<span class="frac"><span>${x.n}</span><span>${x.d}</span></span>`:`<span>${neg(x.v)}</span>`).join('');
  const a=$('#ans');a.className='answer';drawInput();
  const fb=$('#fb');fb.className='feedback note';
  fb.textContent=g.review?'Second look: you missed this one earlier':(p.op==='frac'&&save.ops.frac.c<15?'Answer as a fraction like 7/12':'');

function drawInput(pop){

function press(k){

  if(k==='enter'){submit();return;}
  if(k==='skip'){miss(null);return;}
  let s=g.input;
  if(/^\d$/.test(k)){if(s.replace(/[-\/]/g,'').length<8)s+=k;}
  else if(k==='back')s=s.slice(0,-1);

function submit(){

function correct(v){

  const L=g.p.level||Math.round(g.lv[op]);
  const lim=speedLimit(op,L);
  const base=payFor(L)+(op==='frac'?1:0);

  const o=save.ops[op];o.c++;o.a++;o.t+=dt;

function miss(typed){

        <tr class="total"><td>Total</td><td>${coinSvg()} +${total+g.dailyBonus}</td></tr>
      </tbody></table></div>
    ${g.misses.length?`<div><p class="eyebrow">Review these (${g.misses.length})</p><ul class="misses">${g.misses.slice(0,12).map(m=>`<li><span class="q">${m.q} =</span><span>${m.you?`<span class="you">${m.you}</span>`:''}<span class="a">${m.a}</span></span></li>`).join('')}</ul></div>`:`<p class="muted" style="margin:0">No misses this run.</p>`}
    <div class="row2"><button class="ghost" data-g="home">Done</button><button class="go" data-g="again">Again</button></div>
  </div></div>`;
  g=null;resultsAt=Date.now();
  sfx(pb||streakRecord||r0!==r1?'record':'finish');
  if(total>0)setTimeout(()=>sfx('coins',Math.ceil(total/12)),pb||streakRecord?1100:650);
  if(fxOn('coins'))setTimeout(()=>burst('coins'),250);
  if((pb||streakRecord)&&fxOn('confetti'))burst('bits');
  renderPurse();
}
function closeLayer(){$('#layer').innerHTML='';g=null;unlockScreen();document.getElementById('nav').hidden=false;tab='play';render();}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const bar=e.target.closest&&e.target.closest('[data-bar]');
  if(bar){const n=document.getElementById('chart-note');if(n){n.textContent=bar.getAttribute('data-bar');}document.querySelectorAll('.bar-g.sel').forEach(x=>x.classList.remove('sel'));bar.classList.add('sel');return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){sfx('tap');tab=t.dataset.tab;confirmReset=false;exportShown=false;exportMsg='';importMsg='';pendingImport=null;render();window.scrollTo(0,0);return;}
  if(t.dataset.k){if(performance.now()-lastPtr>700)press(t.dataset.k);return;}
  if(t.dataset.g){const a=t.dataset.g;
    if(a==='end')finish(true);
    else if(a==='home')closeLayer();
    else if(a==='again'){$('#layer').innerHTML='';startRun();}
    return;}
  if(t.dataset.mode||t.dataset.dur||t.dataset.count||t.dataset.diff||t.dataset.op||t.dataset.tab===undefined&&t.dataset.act)sfx('tap');
  const s=save.set;
  if(t.dataset.mode){s.mode=t.dataset.mode;persist();render();return;}
  if(t.dataset.dur){s.dur=+t.dataset.dur;persist();render();return;}
  if(t.dataset.count){s.count=+t.dataset.count;persist();render();return;}
  if(t.dataset.goal){sfx('tap');rollDaily();save.daily.goal=+t.dataset.goal;if(!save.daily.claimed&&save.daily.correct>=goalN())claimDaily();persist();render();return;}
  if(t.dataset.diff){s.diff=t.dataset.diff;persist();render();return;}
  if(t.dataset.op){const k=t.dataset.op,i=s.ops.indexOf(k);
    if(i>=0){if(s.ops.length===1){toast('Keep at least one operation');return;}s.ops.splice(i,1);}else s.ops.push(k);
    s.ops.sort((a,b)=>Object.keys(OPS).indexOf(a)-Object.keys(OPS).indexOf(b));persist();render();return;}
  if(t.dataset.act==='start'){startRun();return;}
  const d=t.dataset.do;if(!d)return;
  if(d==='buy'){const kind=t.dataset.kind,id=t.dataset.id,item=(kind==='skins'?SKINS:kind==='inks'?INKS:kind==='sounds'?SOUNDS:FX)[id];
    if(save.carries<item.price)return;save.carries-=item.price;save.owned[kind].push(id);
    if(kind==='skins')save.eq.skin=id;else if(kind==='inks')save.eq.ink=id;else if(kind==='sounds')save.eq.sound=id;else save.eq.fx[id]=true;
    persist();applyLook();render();toast(item.name+' unlocked');sfx('buy');if(kind==='sounds')setTimeout(()=>sfx('preview'),700);
    if(kind==='fx'){burst(id==='coins'?'coins':'bits');}return;}
  if(d==='equip'){const kind=t.dataset.kind,id=t.dataset.id;if(kind==='skins')save.eq.skin=id;else if(kind==='sounds')save.eq.sound=id;else save.eq.ink=id;persist();applyLook();render();sfx(kind==='sounds'?'preview':'tap');return;}
  if(d==='togglefx'){const id=t.dataset.id;save.eq.fx[id]=!save.eq.fx[id];persist();render();return;}
  if(d==='power'){const id=t.dataset.id,item=POWER[id];if(save.carries<item.price)return;
    if(id==='freeze'){if(save.freezes>=3)return;save.freezes++;}else{if(save.double)return;save.double=true;}
    save.carries-=item.price;persist();render();toast(item.name+' ready');sfx('buy');return;}
  if(d==='sound'){save.set.sound=!save.set.sound;persist();render();if(save.set.sound)sfx('preview');return;}
  if(d==='keysounds'){save.set.keySounds=save.set.keySounds===false;persist();render();if(save.set.keySounds)sfx('key','7');return;}
  if(d==='silent'){save.set.ignoreSilent=!save.set.ignoreSilent;applySession();persist();render();sfx('preview');return;}
  if(d==='testsound'){sfx('record');return;}
  if(d==='export'){
    const code=encodeSave();exportMsg='';
    const done=()=>{exportShown=false;exportMsg='Copied';render();setTimeout(()=>{if(exportMsg==='Copied'){exportMsg='';if(tab==='stats'&&!g)render();}},2500);};
    const fail=()=>{exportShown=true;render();const ta=document.getElementById('export-code');if(ta){ta.focus();ta.select();}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done,fail);else fail();}catch(e){fail();}
    return;}
  if(d==='import'){const v=decodeSave(importText);if(!v){importMsg=importText.trim()?'That code isn\'t a complete save code. Copy it again and paste the whole thing.':'Paste a save code first.';render();return;}
    importMsg='';pendingImport=v;render();return;}
  if(d==='import-no'){pendingImport=null;render();return;}
  if(d==='import-yes'){save=pendingImport;pendingImport=null;importText='';persist();applyLook();render();toast('Progress loaded');return;}
  if(d==='reset'){confirmReset=true;render();return;}
  if(d==='reset-no'){confirmReset=false;render();return;}
  if(d==='reset-yes'){confirmReset=false;save=freshSave();persist();applyLook();render();toast('Progress erased');return;}
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='vol'){save.set.vol=+e.target.value;if(SND.out)SND.out.gain.value=volLevel();}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='vol'){persist();sfx('preview');}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='import-code'){importText=e.target.value;if(importMsg){importMsg='';}}});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(g&&!g.ended){
    let k=null;
    if(/^[0-9]$/.test(e.key))k=e.key;
    else if(e.key==='/')k='/';
    else if(e.key==='-'||e.key==='_')k='-';
    else if(e.key==='Backspace')k='back';
    else if(e.key==='Enter')k='enter';
    else if(e.key===' ')k='skip';
    else if(e.key==='Escape'){e.preventDefault();finish(true);return;}
    if(k){e.preventDefault();if(e.repeat&&(k==='enter'||k==='skip'))return;if(!(g.locked&&!g.buffering))sfx('key',k);press(k);
      const b=document.querySelector(`.key[data-k="${k}"]`);if(b){b.classList.add('down');ripple(b);setTimeout(()=>b.classList.remove('down'),110);}}
    return;
  }
  if($('#layer').innerHTML&&(e.key==='Enter'||e.key==='Escape')){e.preventDefault();if(Date.now()-resultsAt<900||e.repeat)return;e.key==='Enter'?($('#layer').innerHTML='',startRun()):closeLayer();}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){writeLocal();if(cloud.ref&&!g)flushCloud();}else if(g&&!g.ended)lockScreen();});

/* ---------- boot ---------- */
rollDaily();applyLook();render();initCloud();
(function announce(){
  const KEY='carry-the-one-version';let seen=null;
  try{seen=localStorage.getItem(KEY);localStorage.setItem(KEY,APP_VERSION);}catch(e){return;}
  if(seen&&seen!==APP_VERSION){setTimeout(()=>toast('Updated to v'+APP_VERSION+': '+CHANGELOG[0][2][0]),400);}
})();
})();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
